<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
</head>

<body>

    <h1>Student Performance Analytics System</h1>

    <form method="GET" action="{{ url_for('student_web.students_page') }}">

    <input
        type="text"
        name="search"
        placeholder="Search by name or email"
        value="{{ search }}"
    >

    <button type="submit">
        Search
    </button>

    <a href="{{ url_for('student_web.students_page') }}">
        Clear
    </a>

</form>

<br>

    <h2>Students</h2>

    <a href="/students/new">Add New Student</a>

    <br><br>

    <table border="1" cellpadding="10">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for student in students %}

            <tr>

                <td>{{ student.id }}</td>

                <td>{{ student.name }}</td>

                <td>{{ student.email }}</td>

                <td>

                    <a href="/students/{{ student.id }}">
                        View
                    </a>

                    |

                    <a href="/students/{{ student.id }}/edit">
                        Edit
                    </a>

                    |

                    <form
                        action="/students/{{ student.id }}"
                        method="POST"
                        style="display:inline;"
                    >

                        <input
                            type="hidden"
                            name="_method"
                            value="DELETE"
                        >

                        <button
                            type="submit"
                            onclick="return confirm('Are you sure you want to delete this student?');"
                        >
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            {% else %}

            <tr>
                <td colspan="4">
                    No students found.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>
</html>
