<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>

<body>

    <h1>Edit Student</h1>

    <form action="/students/{{ student.id }}" method="POST">

        <input
            type="hidden"
            name="_method"
            value="PUT"
        >

        <label>Name:</label>
        <br>

        <input
            type="text"
            name="name"
            value="{{ student.name }}"
            required
        >

        <br><br>

        <label>Email:</label>
        <br>

        <input
            type="email"
            name="email"
            value="{{ student.email }}"
            required
        >

        <br><br>

        <button type="submit">
            Update Student
        </button>

    </form>

    <br>

    <a href="/students/{{ student.id }}">
        Cancel
    </a>

</body>
</html>
