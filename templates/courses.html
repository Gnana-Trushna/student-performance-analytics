<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>
</head>

<body>

    <h1>Student Performance Analytics System</h1>

    <h2>Courses</h2>

    <a href="/courses/new">
        Add New Course
    </a>

    <br><br>

    <table border="1" cellpadding="10">

        <thead>
            <tr>
                <th>ID</th>
                <th>Course Name</th>
                <th>Course Code</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for course in courses %}

            <tr>

                <td>
                    {{ course.id }}
                </td>

                <td>
                    {{ course.name }}
                </td>

                <td>
                    {{ course.code }}
                </td>

                <td>

                    <a href="/courses/{{ course.id }}">
                        View
                    </a>

                    |

                    <a href="/courses/{{ course.id }}/edit">
                        Edit
                    </a>

                    |

                    <form
                        action="/courses/{{ course.id }}"
                        method="POST"
                        style="display:inline;"
                    >

                        <input
                            type="hidden"
                            name="_method"
                            value="DELETE"
                        >

                        <button
                            type="submit"
                            onclick="return confirm('Are you sure you want to delete this course?');"
                        >
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            {% else %}

            <tr>

                <td colspan="4">
                    No courses found.
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</body>
</html>
